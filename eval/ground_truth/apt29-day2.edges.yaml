# Only events that an MVP predicate may relate are in the edge universe.
# EID 1 is the canonical record for a process action; EID 3 for a connection;
# EID 7 for a module load; EID 11 for a file write. There are no alternate
# canonical records in this key: an equivalence list is therefore empty unless
# this source log is later reproduced with an explicitly mapped line identity.
eligibility:
  sysmon_event_ids: [1, 3, 7, 11]
  hostname_required_for_every_predicate: true
  canonical_action_records:
    "1": ProcessCreate
    "3": NetworkConnect
    "7": ImageLoad
    "11": FileCreate
  equivalence_grammar:
    canonical_reference: [source_sha256, one_based_ndjson_line]
    alternate_references: []
    note: "Event IDs 5 and all non-1/3/7/11 records are not interchangeable with these event identities."

matching_algorithm:
  - Resolve each endpoint to its canonical [source_sha256, one_based_ndjson_line] identity.
  - Match only an identical [source, target, relation_type] triple whose endpoint Hostname values match.
  - Deduplicate identical resolved triples before proposal or verification scoring.
  - Exclude unmatched in-universe-looking emissions unless they resolve to a negative_confounder_pair; a matching negative counts against verification precision.
observable_true_edge_set: "All true_edges below; no true edge in this artifact is marked telemetry-unobservable."

